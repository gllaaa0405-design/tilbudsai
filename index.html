<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TilbudsAI – tjenester og jobber</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#09264a;
  --green:#19b974;
  --bg:#f4f7fb;
  --text:#102a43;
  --muted:#66788f;
  --border:#e1e8f0;
  --white:#fff;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:white;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--blue);
  margin-right:auto;
}

.logo span{
  color:var(--green);
}

.nav button{
  border:0;
  background:transparent;
  color:var(--blue);
  padding:10px 12px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

.nav button:hover{
  background:#eef3f8;
}

.accountBtn{
  background:var(--blue)!important;
  color:white!important;
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 18px 80px;
}

.hero{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:45px 30px;
  margin-bottom:20px;
  box-shadow:0 8px 30px #09264a12;
}

.hero h1{
  margin:0;
  color:var(--blue);
  font-size:clamp(36px,6vw,60px);
  line-height:1;
}

.hero p{
  color:var(--muted);
  font-size:19px;
  line-height:1.6;
  max-width:720px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 18px;
  font-weight:850;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:var(--green);
  color:white;
}

.dark{
  background:var(--blue);
  color:white;
}

.light{
  background:#edf2f7;
  color:var(--blue);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px #09264a0a;
}

.card h2,
.card h3{
  margin-top:0;
  color:var(--blue);
}

.muted{
  color:var(--muted);
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d3dde8;
  border-radius:10px;
  padding:13px;
  font:inherit;
  margin:6px 0 14px;
  background:white;
}

textarea{
  resize:vertical;
}

label{
  display:block;
  font-weight:800;
  font-size:14px;
  margin-top:5px;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.full{
  grid-column:1/-1;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  background:#e5f8ef;
  color:#087c4b;
  border-radius:20px;
  margin:3px;
  font-size:12px;
  font-weight:800;
}

.jobCard{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.meta{
  color:var(--muted);
  font-size:14px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#071b32aa;
  z-index:100;
  padding:18px;
  overflow:auto;
}

.modal{
  max-width:700px;
  margin:30px auto;
  background:white;
  border-radius:20px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#edf2f7;
  cursor:pointer;
  font-size:22px;
}

.messageList{
  max-height:350px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
}

.message{
  background:#edf2f7;
  padding:10px 13px;
  border-radius:13px;
  margin:7px;
  max-width:80%;
}

.message.mine{
  margin-left:auto;
  background:#dff6eb;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px;
}

.profileHeader{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
}

@media(max-width:760px){

  .grid,
  .formGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .nav button:not(.accountBtn){
    display:none;
  }

  .hero{
    padding:32px 20px;
  }
}
</style>
</head>

<body>

<header>

<div class="nav">

  <div class="logo">
    🔨 Tilbuds<span>AI</span>
  </div>

  <button onclick="showHome()">
    🏠 Forside
  </button>

  <button onclick="showJobs()">
    📢 Jobber
  </button>

  <button onclick="showProviders()">
    👷 Tjenester
  </button>

  <button onclick="showMessages()">
    💬 Meldinger
  </button>

  <button
    class="accountBtn"
    onclick="showAccount()"
  >
    👤 Min konto
  </button>

</div>

</header>


<main id="app"></main>


<div
  class="overlay"
  id="overlay"
  onclick="outsideClose(event)"
>

<div
  class="modal"
  id="modal"
></div>

</div>


<script>

/* =========================
   DEMO DATABASE
   ========================= */

let currentUser =
  JSON.parse(
    localStorage.getItem("tilbudsaiUser") || "null"
  );

let profiles =
  JSON.parse(
    localStorage.getItem("tilbudsaiProfiles") || "[]"
  );

let jobs =
  JSON.parse(
    localStorage.getItem("tilbudsaiJobs") || "[]"
  );

let conversations =
  JSON.parse(
    localStorage.getItem("tilbudsaiMessages") || "[]"
  );


/* =========================
   HJELPEFUNKSJONER
   ========================= */

function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function openModal(){

  document
    .getElementById("overlay")
    .style.display="block";

}


function closeModal(){

  document
    .getElementById("overlay")
    .style.display="none";

}


function outsideClose(event){

  if(event.target.id==="overlay"){
    closeModal();
  }

}


/* =========================
   FORSIDE
   ========================= */

function showHome(){

  document.getElementById("app").innerHTML=`

    <section class="hero">

      <h1>
        Finn riktig hjelp.
        <br>
        Eller finn nye kunder.
      </h1>

      <p>
        TilbudsAI gjør det enkelt å koble
        mennesker som trenger tjenester med
        dyktige tjenesteleverandører.
      </p>

      <div class="actions">

        <button
          class="btn primary"
          onclick="openJobForm()"
        >
          📢 Jeg trenger en tjeneste
        </button>

        <button
          class="btn dark"
          onclick="showProviders()"
        >
          👷 Jeg tilbyr tjenester
        </button>

      </div>

    </section>


    <div class="grid">

      <div class="card">

        <h2>🏠 Trenger du hjelp?</h2>

        <p class="muted">
          Legg ut en jobb og la relevante
          tjenesteleverandører kontakte deg.
        </p>

        <button
          class="btn primary"
          onclick="openJobForm()"
        >
          Legg ut jobb
        </button>

      </div>


      <div class="card">

        <h2>👷 Tilbyr du tjenester?</h2>

        <p class="muted">
          Lag en profil, vis hva du kan
          og finn nye kunder.
        </p>

        <button
          class="btn dark"
          onclick="showAccount()"
        >
          Lag leverandørprofil
        </button>

      </div>


      <div class="card">

        <h2>🤖 AI-hjelp</h2>

        <p class="muted">
          AI hjelper deg med å skrive
          gode annonser og profesjonelle tilbud.
        </p>

        <button
          class="btn light"
          onclick="alert('AI-funksjonen kobles inn her.')"
        >
          Bruk AI
        </button>

      </div>

    </div>

  `;

}


/* =========================
   JOBBER
   ========================= */

function showJobs(){

  document.getElementById("app").innerHTML=`

    <div class="actions"
         style="justify-content:space-between">

      <div>

        <h2>📢 Jobber</h2>

        <p class="muted">
          Finn jobber som trenger hjelp.
        </p>

      </div>

      <button
        class="btn primary"
        onclick="openJobForm()"
      >
        📢 Legg ut jobb
      </button>

    </div>


    <div class="card">

      <input
        id="jobSearch"
        placeholder="Søk etter maling, flytting, Oslo..."
        oninput="renderJobs()"
      >

    </div>


    <div
      id="jobList"
      class="grid"
      style="margin-top:16px"
    ></div>

  `;

  renderJobs();

}


function renderJobs(){

  const list =
    document.getElementById("jobList");

  if(!list) return;


  const search =
    (
      document.getElementById("jobSearch")?.value || ""
    ).toLowerCase();


  const filtered =
    jobs.filter(function(job){

      return (
        job.title +
        " " +
        job.location +
        " " +
        job.category +
        " " +
        job.description
      )
      .toLowerCase()
      .includes(search);

    });


  if(filtered.length===0){

    list.innerHTML=`

      <div class="card empty">

        Ingen jobber funnet ennå.

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered.map(function(job){

      return `

        <article class="card jobCard">

          <h3>
            🏠 ${escapeHTML(job.title)}
          </h3>

          <div class="meta">
            📍 ${escapeHTML(job.location)}
            ·
            📅 ${escapeHTML(job.date)}
          </div>

          <div>

            <span class="tag">
              ${escapeHTML(job.category)}
            </span>

          </div>

          <p>
            ${escapeHTML(job.description)}
          </p>

          <button
            class="btn primary"
            onclick="openJob('${job.id}')"
          >
            Se jobb
          </button>

        </article>

      `;

    }).join("");

}


/* =========================
   LEGG UT JOBB
   ========================= */

function openJobForm(){

  if(!currentUser){

    openLogin("For å legge ut en jobb må du opprette konto eller logge inn.");

    return;

  }


  document.getElementById("modal").innerHTML=`

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>📢 Legg ut en jobb</h2>

    <p class="muted">
      Beskriv hva du trenger hjelp med.
    </p>


    <form id="jobForm">

      <div class="formGrid">

        <div>

          <label>
            Hva trenger du hjelp med?
          </label>

          <input
            id="jobTitle"
            placeholder="F.eks. Male stue og gang"
            required
          >

        </div>


        <div>

          <label>
            Hvor?
          </label>

          <input
            id="jobLocation"
            placeholder="F.eks. Oslo"
            required
          >

        </div>


        <div>

          <label>
            Kategori
          </label>

          <select id="jobCategory">

            <option>Maling</option>
            <option>Elektriker</option>
            <option>Rørlegger</option>
            <option>Renhold</option>
            <option>Flytting</option>
            <option>Bygg</option>
            <option>Hage</option>
            <option>Annet</option>

          </select>

        </div>


        <div>

          <label>
            Når?
          </label>

          <input
            id="jobDate"
            placeholder="F.eks. Så snart som mulig"
          >

        </div>


        <div class="full">

          <label>
            Beskriv jobben
          </label>

          <textarea
            id="jobDescription"
            rows="5"
            placeholder="Fortell hva som skal gjøres..."
            required
          ></textarea>

        </div>

      </div>


      <button
        class="btn primary"
        type="submit"
      >
        📢 Publiser jobb
      </button>

    </form>

  `;


  document
    .getElementById("jobForm")
    .onsubmit=function(event){

      event.preventDefault();


      const job={

        id:
          Date.now().toString(),

        owner:
          currentUser.id,

        title:
          document.getElementById("jobTitle").value,

        location:
          document.getElementById("jobLocation").value,

        category:
          document.getElementById("jobCategory").value,

        date:
          document.getElementById("jobDate").value,

        description:
          document.getElementById("jobDescription").value,

        created:
          new Date().toISOString()

      };


      jobs.unshift(job);


      localStorage.setItem(
        "tilbudsaiJobs",
        JSON.stringify(jobs)
      );


      closeModal();

      showJobs();

    };


  openModal();

}


/* =========================
   SE JOBB
   ========================= */

function openJob(id){

  const job =
    jobs.find(
      function(x){
        return x.id===id;
      }
    );


  if(!job) return;


  const owner =
    profiles.find(
      function(p){
        return p.id===job.owner;
      }
    );


  document.getElementById("modal").innerHTML=`

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>
      🏠 ${escapeHTML(job.title)}
    </h2>

    <p class="meta">
      📍 ${escapeHTML(job.location)}
      ·
      📅 ${escapeHTML(job.date)}
    </p>

    <span class="tag">
      ${escapeHTML(job.category)}
    </span>

    <p>
      ${escapeHTML(job.description)}
    </p>

    <hr>

    <h3>
      💬 Interessert i jobben?
    </h3>

    ${
      currentUser

      ?

      `

      <textarea
        id="interestMessage"
        rows="4"
        placeholder="Hei! Jeg er interessert i å hjelpe med denne jobben..."
      ></textarea>

      <button
        class="btn primary"
        onclick="sendMessage(
          '${job.owner}',
          '${job.id}'
        )"
      >
        📨 Send melding til kunden
      </button>

      `

      :

      `

      <button
        class="btn primary"
        onclick="openLogin('Logg inn for å kontakte kunden.')"
      >
        🔐 Logg inn for å kontakte kunden
      </button>

      `

    }

  `;


  openModal();

}


/* =========================
   TJENESTELEVERANDØRER
   ========================= */

function showProviders(){

  document.getElementById("app").innerHTML=`

    <h2>👷 Finn tjenesteleverandører</h2>

    <p class="muted">
      Finn folk og bedrifter som tilbyr tjenester.
    </p>


    <div class="card">

      <input
        id="providerSearch"
        placeholder="Søk etter maler, elektriker, Oslo..."
        oninput="renderProviders()"
      >

    </div>


    <div
      id="providerList"
      class="grid"
      style="margin-top:16px"
    ></div>

  `;

  renderProviders();

}


function renderProviders(){

  const list =
    document.getElementById("providerList");

  if(!list) return;


  const search =
    (
      document.getElementById("providerSearch")?.value || ""
    ).toLowerCase();


  const providersList =
    profiles.filter(function(profile){

      return (
        profile.role==="provider" &&
        (
          profile.name +
          " " +
          profile.company +
          " " +
          profile.location +
          " " +
          profile.services +
          " " +
          profile.description
        )
        .toLowerCase()
        .includes(search)
      );

    });


  if(!providersList.length){

    list.innerHTML=`

      <div class="card empty">

        Ingen tjenesteleverandører funnet ennå.

      </div>

    `;

    return;

  }


  list.innerHTML =
    providersList.map(function(profile){

      return `

        <article class="card">

          <div class="profileHeader">

            <div class="avatar">
              👷
            </div>

            <div>

              <h3 style="margin-bottom:3px">
                ${escapeHTML(profile.name)}
              </h3>

              <div class="muted">
                ${escapeHTML(profile.company || "")}
              </div>

            </div>

          </div>

          <p>
            📍 ${escapeHTML(profile.location)}
          </p>

          <p>
            ${escapeHTML(profile.description || "Tilbyr tjenester på TilbudsAI.")}
          </p>

          <div>

            ${
              (profile.services || "")
              .split(",")
              .filter(Boolean)
              .map(function(service){

                return `
                  <span class="tag">
                    ${escapeHTML(service.trim())}
                  </span>
                `;

              })
              .join("")

            }

          </div>

          <button
            class="btn primary"
            onclick="contactProvider('${profile.id}')"
          >
            💬 Kontakt
          </button>

        </article>

      `;

    }).join("");

}


/* =========================
   KONTAKT LEVERANDØR
   ========================= */

function contactProvider(id){

  if(!currentUser){

    openLogin("Logg inn for å kontakte en tjenesteleverandør.");

    return;

  }


  document.getElementById("modal").innerHTML=`

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>💬 Send melding</h2>

    <textarea
      id="providerMessage"
      rows="5"
      placeholder="Skriv meldingen din..."
    ></textarea>

    <button
      class="btn primary"
      onclick="sendMessage('${id}',null)"
    >
      📨 Send melding
    </button>

  `;


  openModal();

}


/* =========================
   MELDINGER
   ========================= */

function sendMessage(receiver,jobId){

  const field =
    document.getElementById(
      jobId
        ? "interestMessage"
        : "providerMessage"
    );


  const text =
    field?.value.trim();


  if(!text){

    alert("Skriv en melding først.");

    return;

  }


  conversations.push({

    id:
      Date.now().toString(),

    sender:
      currentUser.id,

    receiver:
      receiver,

    job:
      jobId,

    text:
      text,

    time:
      new Date().toISOString()

  });


  localStorage.setItem(
    "tilbudsaiMessages",
    JSON.stringify(conversations)
  );


  closeModal();

  alert("✅ Meldingen er sendt!");

  showMessages();

}


function showMessages(){

  if(!currentUser){

    openLogin("Logg inn for å se meldingene dine.");

    return;

  }


  document.getElementById("app").innerHTML=`

    <h2>💬 Meldinger</h2>

    <p class="muted">
      Her kan kunder og tjenesteleverandører kommunisere.
    </p>

    <div
      id="messageArea"
    ></div>

  `;


  renderMessages();

}


function renderMessages(){

  const area =
    document.getElementById("messageArea");

  if(!area) return;


  const mine =
    conversations.filter(function(message){

      return (
        message.sender===currentUser.id ||
        message.receiver===currentUser.id
      );

    });


  if(!mine.length){

    area.innerHTML=`

      <div class="card empty">

        Ingen meldinger ennå.

        <br><br>

        Finn en jobb eller tjenesteleverandør
        for å starte en samtale.

      </div>

    `;

    return;

  }


  const grouped={};


  mine.forEach(function(message){

    const other =
      message.sender===currentUser.id
        ? message.receiver
        : message.sender;


    if(!grouped[other]){
      grouped[other]=[];
    }


    grouped[other].push(message);

  });


  area.innerHTML =
    Object.keys(grouped)
    .map(function(other){

      const otherProfile =
        profiles.find(
          function(p){
            return p.id===other;
          }
        );


      return `

        <div class="card"
             style="margin-bottom:16px">

          <h3>
            💬 ${
              escapeHTML(
                otherProfile?.name ||
                "Bruker"
              )
            }
          </h3>

          <div class="messageList">

            ${
              grouped[other]
              .map(function(message){

                return `

                  <div class="
                    message
                    ${
                      message.sender===currentUser.id
                        ? "mine"
                        : ""
                    }
                  ">

                    ${escapeHTML(message.text)}

                  </div>

                `;

              })
              .join("")

            }

          </div>


          <textarea
            id="reply_${other}"
            rows="2"
            placeholder="Skriv et svar..."
          ></textarea>


          <button
            class="btn primary"
            onclick="reply('${other}')"
          >
            Send
          </button>

        </div>

      `;

    })
    .join("");

}


function reply(receiver){

  const field =
    document.getElementById(
      "reply_"+receiver
    );


  const text =
    field?.value.trim();


  if(!text){
    return;
  }


  conversations.push({

    id:
      Date.now().toString(),

    sender:
      currentUser.id,

    receiver:
      receiver,

    job:
      null,

    text:
      text,

    time:
      new Date().toISOString()

  });


  localStorage.setItem(
    "tilbudsaiMessages",
    JSON.stringify(conversations)
  );


  showMessages();

}


/* =========================
   KONTO
   ========================= */

function showAccount(){

  if(!currentUser){

    openLogin(
      "Opprett konto eller logg inn for å bruke TilbudsAI."
    );

    return;

  }


  const profile =
    profiles.find(
      function(p){
        return p.id===currentUser.id;
      }
    );


  document.getElementById("modal").innerHTML=`

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>👤 Min profil</h2>

    <form id="profileForm">

      <label>
        Jeg er
      </label>

      <select id="role">

        <option
          value="customer"
          ${profile?.role==="customer"?"selected":""}
        >
          🏠 Kunde
        </option>

        <option
          value="provider"
          ${profile?.role==="provider"?"selected":""}
        >
          👷 Tjenesteleverandør
        </option>

      </select>


      <label>
        Navn
      </label>

      <input
        id="name"
        value="${escapeHTML(profile?.name)}"
        required
      >


      <label>
        Firma
      </label>

      <input
        id="company"
        value="${escapeHTML(profile?.company)}"
        placeholder="Firmanavn hvis du har"
      >


      <label>
        Sted
      </label>

      <input
        id="location"
        value="${escapeHTML(profile?.location)}"
        placeholder="Oslo"
      >


      <label>
        Telefon
      </label>

      <input
        id="phone"
        value="${escapeHTML(profile?.phone)}"
        placeholder="Telefonnummer"
      >


      <label>
        Hvilke tjenester tilbyr du?
      </label>

      <input
        id="services"
        value="${escapeHTML(profile?.services)}"
        placeholder="Maling, snekring, flytting"
      >


      <label>
        Om deg
      </label>

      <textarea
        id="description"
        rows="4"
        placeholder="Fortell litt om deg..."
      >${escapeHTML(profile?.description)}</textarea>


      <button
        class="btn primary"
        type="submit"
      >
        💾 Lagre profil
      </button>

    </form>


    <button
      class="btn light"
      style="margin-top:10px"
      onclick="logout()"
    >
      Logg ut
    </button>

  `;


  document
    .getElementById("profileForm")
    .onsubmit=function(event){

      event.preventDefault();


      const newProfile={

        id:
          currentUser.id,

        role:
          document.getElementById("role").value,

        name:
          document.getElementById("name").value,

        company:
          document.getElementById("company").value,

        location:
          document.getElementById("location").value,

        phone:
          document.getElementById("phone").value,

        services:
          document.getElementById("services").value,

        description:
          document.getElementById("description").value

      };


      const index =
        profiles.findIndex(
          function(p){
            return p.id===currentUser.id;
          }
        );


      if(index>=0){

        profiles[index]=newProfile;

      }else{

        profiles.push(newProfile);

      }


      localStorage.setItem(
        "tilbudsaiProfiles",
        JSON.stringify(profiles)
      );


      closeModal();

      alert("✅ Profilen er lagret!");

    };


  openModal();

}


/* =========================
   LOGIN
   ========================= */

function openLogin(message=""){

  document.getElementById("modal").innerHTML=`

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>👤 TilbudsAI-konto</h2>

    <p class="muted">
      ${escapeHTML(message)}
    </p>

    <label>
      Navn
    </label>

    <input
      id="loginName"
      placeholder="Ditt navn"
    >


    <label>
      E-post
    </label>

    <input
      id="loginEmail"
      type="email"
      placeholder="din@email.no"
    >


    <button
      class="btn primary"
      onclick="createAccount()"
    >
      Opprett konto
    </button>

  `;


  openModal();

}


function createAccount(){

  const name =
    document.getElementById("loginName")
      .value.trim();


  const email =
    document.getElementById("loginEmail")
      .value.trim();


  if(!name || !email){

    alert(
      "Fyll inn navn og e-post."
    );

    return;

  }


  currentUser={

    id:
      "user_"+Date.now(),

    name:
      name,

    email:
      email

  };


  localStorage.setItem(
    "tilbudsaiUser",
    JSON.stringify(currentUser)
  );


  closeModal();

  alert(
    "✅ Konto opprettet!"
  );

  showAccount();

}


function logout(){

  currentUser=null;

  localStorage.removeItem(
    "tilbudsaiUser"
  );

  closeModal();

  showHome();

}


/* =========================
   START
   ========================= */

showHome();

</script>

</html>
