<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TilbudsAI – tjenester og jobber</title>

<style>
:root{
  --navy:#09264a;
  --green:#18bd73;
  --bg:#f4f7fb;
  --muted:#61738d;
  --border:#e2e9f1;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:#102a43;
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  gap:10px;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:var(--navy);
  margin-right:auto;
}

.logo span{
  color:var(--green);
}

nav{
  display:flex;
  gap:4px;
}

nav button,
.profile{
  border:0;
  background:transparent;
  padding:10px 12px;
  font-weight:800;
  cursor:pointer;
  color:var(--navy);
}

.profile{
  background:var(--navy);
  color:white;
  border-radius:11px;
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 18px 70px;
}

.hero,
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 28px #102a4310;
}

.hero{
  padding:42px 30px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(34px,6vw,58px);
  line-height:1.02;
  margin:0;
  color:var(--navy);
}

.hero p{
  font-size:19px;
  color:var(--muted);
  max-width:720px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-weight:850;
  cursor:pointer;
}

.primary{
  background:var(--green);
  color:white;
}

.dark{
  background:var(--navy);
  color:white;
}

.soft{
  background:#edf2f7;
  color:var(--navy);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.muted{
  color:var(--muted);
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d6e0ea;
  border-radius:10px;
  font:inherit;
  margin:6px 0 14px;
}

label{
  font-weight:800;
  font-size:13px;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  background:#e9f8f1;
  color:#087b4c;
  margin:3px;
  font-size:12px;
  font-weight:800;
}

.job{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.meta{
  font-size:13px;
  color:var(--muted);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#061a2aaa;
  z-index:30;
  padding:18px;
  overflow:auto;
}

.modal{
  max-width:720px;
  background:white;
  border-radius:20px;
  padding:24px;
  margin:35px auto;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.full{
  grid-column:1/-1;
}

.messages{
  max-height:360px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}

.bubble{
  background:#eef3f8;
  padding:10px 12px;
  border-radius:12px;
  margin:7px;
  max-width:82%;
}

.mine{
  margin-left:auto;
  background:#dff6eb;
}

@media(max-width:750px){

  .grid,
  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  nav button{
    display:none;
  }

  .hero{
    padding:30px 20px;
  }
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
🔨 Tilbuds<span>AI</span>
</div>

<nav>

<button onclick="home()">
🏠 Forside
</button>

<button onclick="jobs()">
📢 Jobber
</button>

<button onclick="providers()">
👷 Tjenester
</button>

<button onclick="messages()">
💬 Meldinger
</button>

</nav>

<button
class="profile"
onclick="account()"
>
👤 Min profil
</button>

</div>

</header>


<main id="app"></main>


<div
class="overlay"
id="ov"
onclick="if(event.target===this)closeM()"
>

<div
class="modal"
id="modal"
></div>

</div>


<script>

/* =========================
   LOKAL DEMO-DATABASE
========================= */

let user =
JSON.parse(
localStorage.getItem("tilbudsaiUser") || "null"
);

let profiles =
JSON.parse(
localStorage.getItem("tilbudsaiProfiles") || "[]"
);

let jobsData =
JSON.parse(
localStorage.getItem("tilbudsaiJobs") || "[]"
);

let messagesData =
JSON.parse(
localStorage.getItem("tilbudsaiMessages") || "[]"
);


/* =========================
   APP
========================= */

const app =
document.getElementById("app");

const ov =
document.getElementById("ov");

const modal =
document.getElementById("modal");


/* =========================
   SIKKER TEKST
========================= */

function e(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   MODAL
========================= */

function openM(){

ov.style.display="block";

}

function closeM(){

ov.style.display="none";

modal.innerHTML="";

}


/* =========================
   FORSIDE
========================= */

function home(){

app.innerHTML=`

<section class="hero">

<h1>
Finn riktig hjelp.
<br>
Eller finn nye kunder.
</h1>

<p>
TilbudsAI kobler mennesker som trenger
tjenester med dyktige tjenesteleverandører.
</p>

<div class="actions">

<button
class="btn primary"
onclick="jobForm()"
>
📢 Jeg trenger en tjeneste
</button>

<button
class="btn dark"
onclick="providers()"
>
👷 Jeg tilbyr tjenester
</button>

<button
class="btn soft"
onclick="jobs()"
>
🔎 Finn jobber
</button>

</div>

</section>


<div class="grid">

<div class="card">

<h2>🏠 Kunde</h2>

<p>
Legg ut en jobb, motta henvendelser
og velg riktig leverandør.
</p>

<button
class="btn primary"
onclick="jobForm()"
>
Legg ut jobb
</button>

</div>


<div class="card">

<h2>👷 Tjenesteleverandør</h2>

<p>
Lag profil, vis tjenestene dine
og finn nye kunder.
</p>

<button
class="btn dark"
onclick="account()"
>
Lag profil
</button>

</div>


<div class="card">

<h2>🤖 TilbudsAI</h2>

<p>
AI skal hjelpe med annonser,
tilbud og profesjonell tekst.
</p>

<button
class="btn soft"
onclick="aiInfo()"
>
Bruk AI
</button>

</div>

</div>

`;

}


/* =========================
   AI
========================= */

function aiInfo(){

  modal.innerHTML = `

    <button
      class="close"
      onclick="closeM()"
    >
      ×
    </button>

    <h2>🤖 TilbudsAI</h2>

    <p class="muted">
      Skriv kort hva jobben gjelder, så skriver AI-en
      en profesjonell tekst for deg.
    </p>

    <label>
      Hva skal gjøres?
    </label>

    <textarea
      id="aiJob"
      rows="6"
      placeholder="F.eks. Male stue og gang, ca. 55 m², to strøk."
    ></textarea>

    <button
      class="btn primary"
      id="aiButton"
      onclick="runAI()"
    >
      🤖 Lag tekst med AI
    </button>

    <div
      id="aiResult"
      style="
        margin-top:20px;
        padding:16px;
        background:#f4f7fb;
        border-radius:12px;
        display:none;
        white-space:pre-line;
      "
    ></div>

  `;

  openM();

}


async function runAI(){

  const text =
    document
      .getElementById("aiJob")
      .value
      .trim();

  if(!text){

    alert("Skriv først hva jobben gjelder.");

    return;

  }

  const button =
    document.getElementById("aiButton");

  const result =
    document.getElementById("aiResult");

  button.disabled = true;
  button.innerText = "🤖 AI skriver...";

  try{

    const response =
      await fetch("/api/generate",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          customer:"Kunden",
          jobType:"Tjeneste",
          job:text,
          hours:0,
          hourly:0,
          materials:0

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error || "AI-feil"
      );

    }


    result.style.display = "block";

    result.innerHTML = `

      <strong>🤖 AI-generert tekst</strong>

      <br><br>

   ${e(
  data.text ||
  "Ingen tekst mottatt."
)}

    `;


  }catch(error){

    console.error(error);

    alert(
      "Kunne ikke koble til AI akkurat nå. Prøv igjen."
    );


  }finally{

    button.disabled = false;

    button.innerText =
      "🤖 Lag tekst med AI";

  }

}


/* =========================
   JOBBER
========================= */

function jobs(){

app.innerHTML=`

<div class="actions"
style="justify-content:space-between">

<div>

<h2>
📢 Jobber
</h2>

<p class="muted">
Finn jobber som kunder har lagt ut.
</p>

</div>

<button
class="btn primary"
onclick="jobForm()"
>
📢 Legg ut jobb
</button>

</div>


<div class="card">

<input
id="search"
placeholder="Søk etter maling, rørlegger, Oslo..."
oninput="renderJobs()"
>

</div>


<div
id="list"
class="grid"
style="margin-top:16px"
></div>

`;

renderJobs();

}


function renderJobs(){

const list =
document.getElementById("list");

if(!list)return;


const q =
(
document.getElementById("search")?.value || ""
).toLowerCase();


const filtered =
jobsData.filter(function(job){

return (

job.title +
" " +
job.location +
" " +
job.category +
" " +
job.description

)
.toLowerCase()
.includes(q);

});


if(!filtered.length){

list.innerHTML=`

<div class="card empty">

Ingen jobber funnet ennå.

</div>

`;

return;

}


list.innerHTML =
filtered.map(function(job){

return `

<article class="card job">

<h3>
🏠 ${e(job.title)}
</h3>

<div class="meta">

📍 ${e(job.location)}

·

📅 ${e(job.date || "Fleksibelt")}

</div>

<span class="tag">
${e(job.category || "Annet")}
</span>

<p>
${e(job.description)}
</p>

<button
class="btn primary"
onclick="viewJob('${job.id}')"
>
Se jobb
</button>

</article>

`;

}).join("");

}


/* =========================
   JOBB-SKJEMA
========================= */

function jobForm(){

if(!user){

login();

return;

}


modal.innerHTML=`

<button
class="close"
onclick="closeM()"
>
×
</button>

<h2>
📢 Legg ut en jobb
</h2>

<p class="muted">
Beskriv hva du trenger hjelp med.
</p>


<form id="jobForm">

<div class="formgrid">


<div>

<label>
Hva trenger du hjelp med?
</label>

<input
id="jobTitle"
placeholder="F.eks. Male stue og gang"
required
>

</div>


<div>

<label>
Hvor?
</label>

<input
id="jobLocation"
placeholder="F.eks. Oslo"
required
>

</div>


<div>

<label>
Kategori
</label>

<select id="jobCategory">

<option>Maling</option>
<option>Elektriker</option>
<option>Rørlegger</option>
<option>Renhold</option>
<option>Flytting</option>
<option>Bygg</option>
<option>Hage</option>
<option>Annet</option>

</select>

</div>


<div>

<label>
Når?
</label>

<input
id="jobDate"
placeholder="Så snart som mulig"
>

</div>


<div class="full">

<label>
Beskriv jobben
</label>

<textarea
id="jobDescription"
rows="5"
placeholder="Hva skal gjøres?"
required
></textarea>

</div>


</div>


<button
class="btn primary"
type="submit"
>
📢 Publiser jobb
</button>

</form>

`;


document
.getElementById("jobForm")
.onsubmit=function(event){

event.preventDefault();


const job={

id:
Date.now().toString(),

owner:
user.id,

title:
document.getElementById("jobTitle").value,

location:
document.getElementById("jobLocation").value,

category:
document.getElementById("jobCategory").value,

date:
document.getElementById("jobDate").value,

description:
document.getElementById("jobDescription").value,

created:
new Date().toISOString()

};


jobsData.unshift(job);


localStorage.setItem(
"tilbudsaiJobs",
JSON.stringify(jobsData)
);


closeM();

jobs();

};

openM();

}


/* =========================
   VIS JOBB
========================= */

function viewJob(id){

const job =
jobsData.find(
function(x){
return x.id===id;
}
);

if(!job)return;


modal.innerHTML=`

<button
class="close"
onclick="closeM()"
>
×
</button>

<h2>
🏠 ${e(job.title)}
</h2>

<p class="muted">
📍 ${e(job.location)}
·
📅 ${e(job.date || "Fleksibelt")}
</p>

<span class="tag">
${e(job.category)}
</span>

<p>
${e(job.description)}
</p>

<hr>

<h3>
💬 Interessert i jobben?
</h3>

${
user

?

`

<textarea
id="interestMessage"
rows="4"
placeholder="Hei! Jeg er interessert i å hjelpe med denne jobben..."
></textarea>

<button
class="btn primary"
onclick="sendMessage(
'${job.owner}',
'${job.id}'
)"
>
📨 Kontakt kunden
</button>

`

:

`

<button
class="btn primary"
onclick="login()"
>
🔐 Logg inn for å kontakte kunden
</button>

`

}

`;

openM();

}


/* =========================
   TJENESTER
========================= */

function providers(){

app.innerHTML=`

<h2>
👷 Finn tjenesteleverandører
</h2>

<p class="muted">
Finn folk og bedrifter som tilbyr tjenester.
</p>


<div class="card">

<input
id="providerSearch"
placeholder="Søk etter maler, elektriker, Oslo..."
oninput="renderProviders()"
>

</div>


<div
id="providerList"
class="grid"
style="margin-top:16px"
></div>

`;

renderProviders();

}


function renderProviders(){

const list =
document.getElementById("providerList");

if(!list)return;


const q =
(
document.getElementById("providerSearch")?.value || ""
).toLowerCase();


const providerList =
profiles.filter(function(p){

return (

p.role==="provider"

&&

(
p.name +
" " +
p.company +
" " +
p.location +
" " +
p.services +
" " +
p.description
)

.toLowerCase()
.includes(q)

);

});


if(!providerList.length){

list.innerHTML=`

<div class="card empty">

Ingen tjenesteleverandører funnet ennå.

<br><br>

Opprett leverandørprofil for å bli synlig her.

</div>

`;

return;

}


list.innerHTML =
providerList.map(function(p){

return `

<article class="card">

<h3>
👷 ${e(p.name)}
</h3>

<strong>
${e(p.company || "Tjenesteleverandør")}
</strong>

<p>
📍 ${e(p.location)}
</p>

<p>
${e(
p.description ||
"Tilbyr tjenester via TilbudsAI."
)}
</p>

<div>

${
(p.services || "")
.split(",")
.filter(Boolean)
.map(function(service){

return `

<span class="tag">
${e(service.trim())}
</span>

`;

})
.join("")
}

</div>

<button
class="btn primary"
onclick="contactProvider('${p.id}')"
>
💬 Kontakt
</button>

</article>

`;

}).join("");

}


/* =========================
   KONTAKT
========================= */

function contactProvider(id){

if(!user){

login();

return;

}


modal.innerHTML=`

<button
class="close"
onclick="closeM()"
>
×
</button>

<h2>
💬 Send melding
</h2>

<textarea
id="providerMessage"
rows="5"
placeholder="Skriv meldingen din..."
></textarea>

<button
class="btn primary"
onclick="sendMessage('${id}',null)"
>
📨 Send melding
</button>

`;

openM();

}


/* =========================
   MELDINGER
========================= */

function sendMessage(receiver,jobId){

const field =
jobId

?

document.getElementById(
"interestMessage"
)

:

document.getElementById(
"providerMessage"
);


const text =
field?.value.trim();


if(!text){

alert(
"Skriv en melding først."
);

return;

}


messagesData.push({

id:
Date.now().toString(),

sender:
user.id,

receiver:
receiver,

job:
jobId,

text:
text,

time:
new Date().toISOString()

});


localStorage.setItem(
"tilbudsaiMessages",
JSON.stringify(messagesData)
);


closeM();

alert(
"✅ Meldingen er sendt!"
);

messages();

}


function messages(){

if(!user){

login();

return;

}


app.innerHTML=`

<h2>
💬 Meldinger
</h2>

<p class="muted">
Kommuniser med kunder og tjenesteleverandører.
</p>

<div id="messageArea"></div>

`;

renderMessages();

}


function renderMessages(){

const area =
document.getElementById("messageArea");

if(!area)return;


const mine =
messagesData.filter(function(message){

return (

message.sender===user.id ||

message.receiver===user.id

);

});


if(!mine.length){

area.innerHTML=`

<div class="card empty">

Ingen meldinger ennå.

<br><br>

Finn en jobb eller tjenesteleverandør
for å starte en samtale.

</div>

`;

return;

}


const grouped={};


mine.forEach(function(message){

const other =
message.sender===user.id
? message.receiver
: message.sender;


if(!grouped[other]){
grouped[other]=[];
}


grouped[other].push(message);

});


area.innerHTML =
Object.keys(grouped)
.map(function(other){

const otherProfile =
profiles.find(
function(p){
return p.id===other;
}
);


return `

<div
class="card"
style="margin-bottom:16px"
>

<h3>
💬 ${
e(
otherProfile?.name ||
"Bruker"
)
}
</h3>


<div class="messages">

${
grouped[other]
.map(function(message){

return `

<div
class="
bubble
${
message.sender===user.id
? "mine"
: ""
}
"
>

${e(message.text)}

</div>

`;

})
.join("")
}

</div>


<textarea
id="reply_${other}"
rows="2"
placeholder="Skriv et svar..."
></textarea>


<button
class="btn primary"
onclick="reply('${other}')"
>
Send
</button>

</div>

`;

})
.join("");

}


function reply(receiver){

const field =
document.getElementById(
"reply_"+receiver
);


const text =
field?.value.trim();


if(!text)return;


messagesData.push({

id:
Date.now().toString(),

sender:
user.id,

receiver:
receiver,

job:null,

text:
text,

time:
new Date().toISOString()

});


localStorage.setItem(
"tilbudsaiMessages",
JSON.stringify(messagesData)
);


messages();

}


/* =========================
   PROFIL
========================= */

function account(){

if(!user){

login();

return;

}


const p =
profiles.find(
function(x){
return x.id===user.id;
}
) || {};


modal.innerHTML=`

<button
class="close"
onclick="closeM()"
>
×
</button>

<h2>
👤 Min profil
</h2>


<form id="profileForm">


<label>
Jeg er
</label>

<select id="role">

<option
value="customer"
${p.role==="customer"?"selected":""}
>
🏠 Kunde
</option>

<option
value="provider"
${p.role==="provider"?"selected":""}
>
👷 Tjenesteleverandør
</option>

</select>


<label>
Navn
</label>

<input
id="name"
value="${e(p.name)}"
required
>


<label>
Firma
</label>

<input
id="company"
value="${e(p.company)}"
placeholder="Firmanavn"
>


<label>
Sted
</label>

<input
id="location"
value="${e(p.location)}"
placeholder="Oslo"
>


<label>
Telefon
</label>

<input
id="phone"
value="${e(p.phone)}"
placeholder="Telefonnummer"
>


<label>
Tjenester
</label>

<input
id="services"
value="${e(p.services)}"
placeholder="Maling, snekring, flytting"
>


<label>
Om deg
</label>

<textarea
id="description"
rows="4"
placeholder="Fortell litt om deg..."
>${e(p.description)}</textarea>


<button
class="btn primary"
type="submit"
>
💾 Lagre profil
</button>

</form>


<button
class="btn soft"
style="margin-top:10px"
onclick="logout()"
>
Logg ut
</button>

document

>

function createAccount(){

const name =
document.getElementById("loginName")
.value.trim();


const email =
document.getElementById("loginEmail")
.value.trim();


if(!name || !email){

alert(
"Fyll inn navn og e-post."
);

return;

}


user={

id:
"user_"+Date.now(),

name:
name,

email:
email

};


localStorage.setItem(
"tilbudsaiUser",
JSON.stringify(user)
);


closeM();

alert(
"✅ Konto opprettet!"
);

account();

}


function logout(){

user=null;

localStorage.removeItem(
"tilbudsaiUser"
);

closeM();

home();

}
