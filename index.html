<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TilbudsAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #10233f;
    }

    header {
      background: #0d2340;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .logo span {
      color: #20bd72;
    }

    .profile {
      background: #ffffff22;
      padding: 9px 15px;
      border-radius: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #667085;
      font-size: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
    }

  async function generateQuote() {

  const customer =
    document.getElementById("customer").value.trim() || "Kunden";

  const jobType =
    document.getElementById("jobType").value;

  const job =
    document.getElementById("job").value.trim() ||
    "Arbeidet utføres i henhold til avtale.";

  const hours =
    Number(document.getElementById("hours").value) || 0;

  const hourly =
    Number(document.getElementById("hourly").value) || 0;

  const materials =
    Number(document.getElementById("materials").value) || 0;

  const work = hours * hourly;
  const beforeVat = work + materials;
  const vat = beforeVat * 0.25;
  const total = beforeVat + vat;

  const button = document.querySelector(".generate");

  button.innerText = "🤖 Lager tilbud...";
  button.disabled = true;

  try {

    const aiResponse = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        customer,
        jobType,
        job,
        hours,
        hourly,
        materials
      })
    });

    const data = await aiResponse.json();

    if (!aiResponse.ok) {
      throw new Error(data.error || "AI-feil");
    }

    document.getElementById("quoteCustomer").innerText = customer;
    document.getElementById("quoteType").innerText = jobType;

    document.getElementById("quoteJob").innerText =
      data.text || job;

    document.getElementById("workPrice").innerText =
      money(work);

    document.getElementById("materialPrice").innerText =
      money(materials);

    document.getElementById("beforeVat").innerText =
      money(beforeVat);

    document.getElementById("vat").innerText =
      money(vat);

    document.getElementById("total").innerText =
      money(total);

    document.getElementById("result").style.display = "block";
    document.getElementById("success").style.display = "none";

    document.getElementById("result").scrollIntoView({
      behavior: "smooth"
    });

  } catch (error) {

    console.error(error);

    alert("Kunne ikke koble til AI. Prøv igjen.");

  } finally {

    button.innerText = "🤖 Lag profesjonelt tilbud";
    button.disabled = false;

  }
}

function sendQuote() {

  document.getElementById("success").style.display =
    "block";

}

</script>

</body>
</html>
